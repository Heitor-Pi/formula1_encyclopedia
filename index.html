<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 GridFinder — Scuderias, Pilotos, Carros e Temporadas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div class="brand-logo">
        <span class="logo-mark" aria-hidden="true">F1</span>
        <div>
          <h1>F1 GridFinder</h1>
          <p class="subtitle">Explore scuderias, pilotos, carros e temporadas históricas da Fórmula 1</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Painel de Pesquisa: Scuderia, Piloto, Ano + Botão Principal -->
      <section class="search-section" aria-label="Pesquisar por scuderia, piloto e temporada">
        <form id="f1-search-form" class="search-form" autocomplete="off">
          <div class="fields-grid">
            <div class="field-group">
              <label for="team-input">Scuderia (Equipe)</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  id="team-input"
                  name="scuderia"
                  list="teams-datalist"
                  placeholder="Ex: Ferrari, McLaren, Red Bull..."
                  aria-label="Campo para preencher a scuderia ou equipe"
                />
                <datalist id="teams-datalist"></datalist>
              </div>
            </div>

            <div class="field-group">
              <label for="driver-input">Piloto</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  id="driver-input"
                  name="piloto"
                  list="drivers-datalist"
                  placeholder="Ex: Charles Leclerc, Ayrton Senna..."
                  aria-label="Campo para preencher o nome do piloto"
                />
                <datalist id="drivers-datalist"></datalist>
              </div>
            </div>

            <div class="field-group field-year">
              <label for="year-input">Temporada</label>
              <div class="input-wrapper">
                <input
                  type="number"
                  id="year-input"
                  name="ano"
                  list="years-datalist"
                  min="1950"
                  max="2026"
                  value="2024"
                  placeholder="2024"
                  aria-label="Campo para preencher o ano da temporada"
                />
                <datalist id="years-datalist"></datalist>
              </div>
            </div>

            <div class="action-group">
              <button type="submit" id="main-search-btn" class="btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" />
                  <path d="m20 20-3.5-3.5" />
                </svg>
                <span>Pesquisar F1</span>
              </button>
            </div>
          </div>
        </form>

        <!-- Atalhos rápidos de Scuderias da temporada e anos históricos -->
        <div class="quick-bars">
          <div class="quick-row">
            <span class="quick-label">Scuderias:</span>
            <div class="pills-group" id="team-pills" role="group" aria-label="Filtrar por scuderia"></div>
          </div>
          <div class="quick-row">
            <span class="quick-label">Anos icônicos:</span>
            <div class="pills-group" id="year-pills" role="group" aria-label="Selecionar temporada rápida"></div>
          </div>
        </div>

        <p id="search-feedback" class="search-feedback" role="status" aria-live="polite"></p>
      </section>

      <!-- Vitrine com setas para passar e voltar pelos pilotos da scuderia -->
      <section class="showcase-section" aria-label="Vitrine da scuderia, piloto e carro">
        <div class="carousel-wrapper">
          <button
            type="button"
            id="prev-entry-btn"
            class="arrow-btn arrow-prev"
            aria-label="Voltar para o piloto anterior da scuderia"
            title="Piloto anterior"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <article class="f1-card" id="f1-card" aria-live="polite">
            <div class="card-accent-bar" id="card-accent-bar"></div>

            <div class="f1-card-top">
              <div class="f1-badges">
                <span class="badge badge-team" id="card-team-badge">Scuderia</span>
                <span class="badge badge-season" id="card-season-badge">Temporada</span>
                <span class="badge badge-number" id="card-number-badge">#—</span>
              </div>
              <span class="entry-counter" id="entry-counter">1 / 1</span>
            </div>

            <!-- Vitrine dupla: Foto do Piloto + Foto do Carro da Scuderia no Ano -->
            <div class="media-grid">
              <div class="media-box">
                <span class="media-tag">Piloto</span>
                <div class="media-frame" id="driver-visual"></div>
              </div>
              <div class="media-box">
                <span class="media-tag" id="car-media-tag">Carro da Scuderia</span>
                <div class="media-frame" id="car-visual"></div>
              </div>
            </div>

            <div class="f1-info">
              <div class="f1-headline">
                <div>
                  <h2 id="driver-title">Nome do Piloto</h2>
                  <p class="f1-subtitle" id="driver-subtitle">Scuderia • Nacionalidade</p>
                </div>
                <div class="standing-box">
                  <span class="standing-label">Classificação</span>
                  <strong class="standing-pos" id="driver-position">—</strong>
                </div>
              </div>

              <dl class="specs-grid">
                <div class="spec-item">
                  <dt>Scuderia</dt>
                  <dd id="spec-team">—</dd>
                </div>
                <div class="spec-item">
                  <dt>Temporada</dt>
                  <dd id="spec-season">—</dd>
                </div>
                <div class="spec-item">
                  <dt>Pontos</dt>
                  <dd id="spec-points">—</dd>
                </div>
                <div class="spec-item">
                  <dt>Vitórias</dt>
                  <dd id="spec-wins">—</dd>
                </div>
              </dl>
            </div>

            <div class="carousel-dots" id="carousel-dots" aria-label="Indicadores de pilotos da scuderia"></div>
          </article>

          <button
            type="button"
            id="next-entry-btn"
            class="arrow-btn arrow-next"
            aria-label="Passar para o próximo piloto da scuderia"
            title="Próximo piloto"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
